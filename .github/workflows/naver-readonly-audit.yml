name: NAVER read-only audit runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/naver-readonly-audit-20260819' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and inspect public CLOVA application bundles
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/naver-clova-bundles"
          OUT="$ROOT/out"
          mkdir -p "$OUT/chunks"

          cat > "$ROOT/audit.py" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          ROOT = Path(os.environ['RUNNER_TEMP']) / 'naver-clova-bundles'
          OUT = ROOT / 'out'
          CHUNKS = OUT / 'chunks'
          CHUNKS.mkdir(parents=True, exist_ok=True)

          URLS = [
              'https://clova.ai/_next/static/chunks/716-4bc8895918653ea2.js',
              'https://clova.ai/_next/static/chunks/356-3dd847132a3b795f.js',
              'https://clova.ai/_next/static/chunks/pages/index-69eb870b26bec00f.js',
              'https://clova.ai/_next/static/chunks/891-974e99e6ac994be0.js',
              'https://clova.ai/_next/static/chunks/205-6cdb0f0222e1fa21.js',
              'https://clova.ai/_next/static/chunks/pages/tech-blog-731cde12a8ad2854.js',
              'https://clova.ai/_next/static/chunks/pages/search/%5Bterm%5D-0dbd3fc5b25289ed.js',
              'https://clova.ai/_next/static/chunks/pages/hyperclova-e015d3d516dd33fa.js',
          ]
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/142 Safari/537.36'
          MAX_BYTES = 8 * 1024 * 1024
          ENDPOINT_RE = re.compile(r'''(?:https://[^"'\s]+|["'](/(?:api|graphql|search|v\d)/[^"'\s]{0,260})["'])''')
          INTERESTING = {
              'dangerouslySetInnerHTML': re.compile(r'dangerouslySetInnerHTML'),
              'innerHTML': re.compile(r'\.innerHTML\s*='),
              'router.query': re.compile(r'(?:router|query|asPath|pathname|location\.(?:search|hash|pathname))'),
              'URLSearchParams': re.compile(r'URLSearchParams'),
              'decodeURIComponent': re.compile(r'decodeURIComponent'),
              'fetch': re.compile(r'\bfetch\s*\('),
              'axios': re.compile(r'\.(?:get|post)\s*\('),
          }

          def fetch(url: str) -> tuple[int, dict[str, str], bytes, str | None]:
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Encoding': 'identity'}, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      body = resp.read(MAX_BYTES + 1)
                      error = None
                      if len(body) > MAX_BYTES:
                          body = body[:MAX_BYTES]
                          error = 'truncated'
                      result = int(resp.status), {k.lower(): v for k, v in resp.headers.items()}, body, error
              except urllib.error.HTTPError as exc:
                  body = exc.read(MAX_BYTES + 1)[:MAX_BYTES]
                  result = int(exc.code), {k.lower(): v for k, v in exc.headers.items()}, body, f'HTTP {exc.code}'
              except Exception as exc:  # noqa: BLE001
                  result = 0, {}, b'', f'{type(exc).__name__}: {exc}'
              time.sleep(0.9)
              return result

          def contexts(text: str, pattern: re.Pattern[str], radius: int = 700, limit: int = 30) -> list[dict[str, object]]:
              out: list[dict[str, object]] = []
              for match in pattern.finditer(text):
                  out.append({
                      'offset': match.start(),
                      'snippet': text[max(0, match.start()-radius):min(len(text), match.end()+radius)],
                  })
                  if len(out) >= limit:
                      break
              return out

          records = []
          endpoint_set: set[str] = set()
          for index, url in enumerate(URLS, start=1):
              status, headers, body, error = fetch(url)
              filename = f'{index:02d}-{hashlib.sha256(url.encode()).hexdigest()[:12]}.js'
              (CHUNKS / filename).write_bytes(body)
              text = body.decode('utf-8', errors='replace')
              endpoints = []
              for match in ENDPOINT_RE.finditer(text):
                  value = match.group(1) or match.group(0)
                  value = value.strip('"\'')
                  if value not in endpoints:
                      endpoints.append(value)
                      endpoint_set.add(value)
              hits = {name: contexts(text, pattern) for name, pattern in INTERESTING.items()}
              records.append({
                  'url': url,
                  'filename': filename,
                  'status': status,
                  'error': error,
                  'content_type': headers.get('content-type'),
                  'length': len(body),
                  'sha256': hashlib.sha256(body).hexdigest(),
                  'endpoints': endpoints,
                  'interesting': {name: values for name, values in hits.items() if values},
              })

          report = {
              'generated_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'safety': {'methods': ['GET'], 'authentication': False, 'state_changes': False},
              'request_count': len(URLS),
              'bundles': records,
              'unique_endpoints': sorted(endpoint_set),
          }
          (OUT / 'summary.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          public = {
              'audit_complete': True,
              'requests': len(URLS),
              'bundles_downloaded': sum(1 for item in records if item['status'] == 200),
              'unique_endpoint_strings': len(endpoint_set),
              'bundles_with_html_sinks': sum(1 for item in records if 'dangerouslySetInnerHTML' in item['interesting'] or 'innerHTML' in item['interesting']),
          }
          (ROOT / 'public-summary.json').write_text(json.dumps(public, indent=2), encoding='utf-8')
          print(json.dumps(public))
          PY

          python3 "$ROOT/audit.py"
          tar -C "$OUT" -czf "$ROOT/evidence.tar.gz" .
          openssl rand 32 > "$ROOT/key.bin"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$ROOT/evidence.tar.gz" -out "$ROOT/evidence.tar.gz.enc" -pass file:"$ROOT/key.bin"
          cat > "$ROOT/public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAu9ZB1cO7Xoi8jMR0XGgd
          qHKKqUkz+hSyrBFdvFJ5ca/yo7yeKN0ZqRumi99Sbl4v49jTT7oF6s1YDrNpjRWS
          iWgVt4FhOo/8fbs8ZOQDOUZQLqWr0zTbvrmXnG5uMTn5dmOlE5MaWiQA0CvxUuXK
          chNicVzG6/kBSv6iHZNhw3gKuTFbN0httgqss4AKkXNgl3UPhEHEQEhw241o+PxX
          0vzVqE0kFDNlkvVzOX1s/8w03qQwDCHI7SpqwWAXJP/2F6Av4VzXr95jwUE/Icy2
          jUxapf3tjpD47NpGAhtQRukIF/fAFA6wfSpveEYgHKctn9bxfLZriKWGKzXCPzB9
          oBpU5mnToaMAHvQABbeWDRpbHeVm3TkVgXNq/qGJhmEsqP1O80yiEyHAUFD0XINZ
          KA4DTlLuLmM9piz9r9VNZEakL9Co+yiWtq5CdLy+nwh205z2/vT55keYBzonJiAS
          md2fazTVTarygfyb+it15LkUN3sZzAMJVpuX4OY0H1h1AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey "$ROOT/public.pem" -in "$ROOT/key.bin" -out "$ROOT/key.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum "$ROOT/evidence.tar.gz.enc" "$ROOT/key.enc" > "$ROOT/checksums.txt"
          rm -rf "$OUT" "$ROOT/evidence.tar.gz" "$ROOT/key.bin" "$ROOT/public.pem" "$ROOT/audit.py"

      - name: Upload encrypted bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: naver-clova-bundle-evidence-encrypted
          path: |
            ${{ runner.temp }}/naver-clova-bundles/evidence.tar.gz.enc
            ${{ runner.temp }}/naver-clova-bundles/key.enc
            ${{ runner.temp }}/naver-clova-bundles/checksums.txt
            ${{ runner.temp }}/naver-clova-bundles/public-summary.json
          retention-days: 1
          if-no-files-found: error
